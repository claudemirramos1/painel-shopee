name: Bot Automation Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai Pillow

    - name: Diagnóstico do ambiente
      run: |
        echo "===== DIAGNÓSTICO GITHUB ACTIONS ====="
        echo "Commit: $GITHUB_SHA"
        echo "Branch: $GITHUB_REF"
        echo "Runner: $RUNNER_OS"
        echo "Data UTC: $(date -u)"
        echo "Python:"
        python --version
        echo "FFmpeg:"
        if command -v ffmpeg >/dev/null 2>&1; then
          which ffmpeg
          ffmpeg -version | head -n 1
        else
          echo "FFmpeg NÃO ENCONTRADO"
        fi
        echo "FFprobe:"
        if command -v ffprobe >/dev/null 2>&1; then
          which ffprobe
          ffprobe -version | head -n 1
        else
          echo "FFprobe NÃO ENCONTRADO"
        fi
        echo "===================================="

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

    - name: Run Product/Telegram Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        PAGE_ID: ${{ secrets.PAGE_ID }}
      run: |
        python worker.py

    - name: Commit processed posts history
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Atualiza histórico de posts processados automaticamente"
        file_pattern: posts_processados.txt
