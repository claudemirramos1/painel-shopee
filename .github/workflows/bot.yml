name: Bot Automation Suite

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai Pillow

    - name: Run Video Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        MAIN_PAGE_ID: ${{ secrets.MAIN_PAGE_ID }}
        PAGE_ID: ${{ secrets.PAGE_ID }}
      run: |
        python bot_video.py

    - name: Run Product/Telegram Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        PAGE_ID: ${{ secrets.PAGE_ID }}
      run: |
        python worker.py

    - name: Commit processed posts history
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Atualiza histórico de posts processados automaticamente"
        file_pattern: posts_processados.txt
