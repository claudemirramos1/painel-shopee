name: Bot Automation Suite

on:
  workflow_dispatch:

jobs:
  verificar-repositorio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          echo "===== REPOSITÓRIO ====="
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF"
          echo "Python:"
          python --version
          echo "======================="
